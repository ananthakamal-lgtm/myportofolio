<div id="edit-experience-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-experience-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="edit-experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup form edit pengalaman"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="edit-experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup form edit pengalaman">&times;</button>

        <h2 id="edit-experience-modal-title">Edit Pengalaman</h2>
        <form id="edit-experience-form"
              method="post"
              class="project-form"
              novalidate>
            {% csrf_token %}
            <input type="hidden" name="id" id="edit-experience-id">
            {% for field in form %}
                <div class="form-group">
                    <label for="edit_{{ field.name }}">{{ field.label }}</label>
                    {% if field.name == "category" %}
                        <select name="category" id="edit_category" class="form-select">
                            {% for choice_val, choice_label in field.field.choices %}
                                <option value="{{ choice_val }}">{{ choice_label }}</option>
                            {% endfor %}
                        </select>
                    {% elif field.name == "description" %}
                        <textarea name="description"
                                  id="edit_description"
                                  rows="4"
                                  placeholder="Jelaskan peran, tanggung jawab, dan pencapaian Anda..."></textarea>
                    {% elif field.name == "thumbnail" %}
                        <input type="url"
                               name="thumbnail"
                               id="edit_thumbnail"
                               placeholder="https://example.com/logo.png">
                    {% else %}
                        <input type="text"
                               name="{{ field.name }}"
                               id="edit_{{ field.name }}"
                               maxlength="255"
                               placeholder="Contoh: Software Engineering Intern">
                    {% endif %}
                    <p class="form-error" data-error-for="{{ field.name }}" aria-live="polite"></p>
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-experience-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
