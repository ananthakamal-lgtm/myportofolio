<div class="experience-actions">
    <a href="{% url 'main:update_experience' experience.id %}" class="button button-secondary button-sm" aria-label="Edit {{ experience.title }}">
        Edit
    </a>
    <button type="button"
            class="button button-danger button-sm"
            popovertarget="delete-experience-{{ experience.id }}"
            aria-label="Hapus {{ experience.title }}"
            title="Hapus pengalaman">
        Hapus
    </button>
</div>
<div id="delete-experience-{{ experience.id }}"
     class="project-delete-modal"
     popover="auto"
     aria-labelledby="delete-experience-title-{{ experience.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-experience-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-experience-{{ experience.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">
            &times;
        </button>
        <h2 id="delete-experience-title-{{ experience.id }}">Hapus Pengalaman?</h2>
        <p>
            Apakah Anda yakin ingin menghapus <strong>{{ experience.title }}</strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-experience-{{ experience.id }}"
                    popovertargetaction="hide">
                Batal
            </button>
            <form method="post" action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
